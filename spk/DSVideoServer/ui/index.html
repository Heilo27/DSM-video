<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DSVideoServer</title>
<script>
// Redirect to the web player via a RELATIVE path on DSM's own port.
// Never jump to :8090 directly — QuickConnect only relays DSM's port, and a
// port jump fails with "this package cannot be accessed when using QuickConnect".
window.location.replace('/dsvideo/');
</script>
</head>
<body>
<p>Redirecting to DSVideoServer...</p>
<p>If not redirected, <a href="/dsvideo/">click here</a>.</p>
</body>
</html>
