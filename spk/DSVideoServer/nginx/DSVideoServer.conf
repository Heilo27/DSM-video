# DSVideoServer - nginx WebAPI proxy
# Routes Video Station API requests to DSVideoServer backend (port 8080).

# Intercept query.cgi so the DS Video app discovers VideoStation APIs.
# Exact match (=) takes priority over DSM's prefix match for /webapi/.
location = /webapi/query.cgi {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Intercept entry.cgi for VideoStation, API info/discovery, and Auth calls.
# SYNO.API.Auth IS intercepted so DS Video app SIDs are issued by our backend
# (stored in webAPISessions). Unknown Auth methods and subtypes are transparently
# proxied from our backend to auth.cgi — no loop, DSM web UI login unaffected.
# All other DSM APIs fall through to DSM's native SCGI handler.
#
# The official DS Video app (version 3.x) has /webapi/entry.cgi hardcoded for all
# VideoStation API calls and sends api= in the POST body (not the URL). nginx's
# $arg_api only matches URL query-string parameters, so POST body params would
# fall through to SCGI (which has no VideoStation APIs), causing connection failure.
# We catch the DS Video app by user-agent so ALL its requests (GET and POST) go to
# our backend. The $arg_api rule catches GET requests from other clients (web UI,
# scripts, etc.) that have matching APIs in the URL query string.
location = /webapi/entry.cgi {
    # Route all DS Video app requests to our backend regardless of HTTP method.
    # The app puts api= in the POST body, so $arg_api is empty for POST requests.
    if ($http_user_agent ~* "Synology-DS_video") {
        proxy_pass http://127.0.0.1:8080;
    }
    # Catch GET requests for our APIs from other clients (web UI, scripts, etc.)
    if ($arg_api ~* "^SYNO\.(API\.Auth|API\.Info|DSM\.Info|VideoStation)") {
        proxy_pass http://127.0.0.1:8080;
    }
    # Fallback: let DSM handle all other WebAPI calls natively
    include scgi_params;
    scgi_pass unix:/run/synoscgi.sock;
    scgi_read_timeout 3600s;
}

# Route all iOS app REST API calls to our backend.
# The iOS app uses /api/v1/* for login, libraries, items, playback, etc.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# Proxy VideoStation API calls to our server.
# The query.cgi response points VS APIs to DSVideoServer/entry.cgi,
# so the app calls /webapi/DSVideoServer/* which comes here.
location ^~ /webapi/DSVideoServer/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
