<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DS Video</title>
<script>
// Redirect to the DS Video web player on port 8080
// Uses the same hostname as the current page
var host = window.location.hostname;
window.location.replace('http://' + host + ':8080/');
</script>
</head>
<body>
<p>Redirecting to DS Video...</p>
<p>If not redirected, <a id="link">click here</a>.</p>
<script>
document.getElementById('link').href = 'http://' + window.location.hostname + ':8080/';
</script>
</body>
</html>
