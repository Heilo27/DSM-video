<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DSVideoServer</title>
<script>
// Redirect to the DSVideoServer web player on port 8090
// Uses the same hostname as the current page
var host = window.location.hostname;
window.location.replace('http://' + host + ':8090/');
</script>
</head>
<body>
<p>Redirecting to DSVideoServer...</p>
<p>If not redirected, <a id="link">click here</a>.</p>
<script>
document.getElementById('link').href = 'http://' + window.location.hostname + ':8090/';
</script>
</body>
</html>
