# DSVideoServer - nginx WebAPI proxy
# Routes Video Station API requests to DSVideoServer backend (port 8080).

# Intercept query.cgi so the DS Video app discovers VideoStation APIs.
# Exact match (=) takes priority over DSM's prefix match for /webapi/.
location = /webapi/query.cgi {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Intercept entry.cgi so VideoStation API calls from the DS Video app reach
# our backend regardless of whether the app uses the path from query.cgi or
# a hardcoded /webapi/entry.cgi path. Our backend handles SYNO.API.Auth,
# SYNO.DSM.Info, and all SYNO.VideoStation* APIs.
# NOTE: Auth calls from our backend to DSM use /webapi/auth.cgi (not
# intercepted here) to avoid a forwarding loop.
location = /webapi/entry.cgi {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Proxy VideoStation API calls to our server.
# The query.cgi response points VS APIs to DSVideoServer/entry.cgi,
# so the app calls /webapi/DSVideoServer/* which comes here.
location ^~ /webapi/DSVideoServer/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
